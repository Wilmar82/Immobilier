name: Synchronisation quotidienne des biens Advance Immobilier

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install beautifulsoup4 playwright
          playwright install chromium
          python sync_biens_advance.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add biens_advance.json
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des biens" && git push)
